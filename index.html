<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ficha de Terreno — Riego</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2545">
<style>
:root{
  --navy:#0b2545; --blue:#1e5f9e; --blue-mid:#2f7dc4; --ice:#dceaf7; --frost:#f3f8fd;
  --fog:#d8dee6; --slate:#5a6b7a; --mist:#8a97a3; --white:#ffffff;
  --ok:#1f8a4c; --warn:#b8860b; --err:#c0392b;
  --mono:'DM Mono','SFMono-Regular',Consolas,monospace;
  --sans:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:8px;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:16px;background:var(--frost);color:var(--navy);-webkit-tap-highlight-color:transparent}
.topbar{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:1rem;font-weight:700;margin:0;flex:1}
.topbar button{background:rgba(255,255,255,.12);border:none;color:#fff;padding:8px 12px;border-radius:var(--r);font-family:var(--sans);font-weight:600;font-size:.8rem;cursor:pointer}
.topbar button:active{background:rgba(255,255,255,.25)}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px 90px}
.card{background:#fff;border:1px solid var(--fog);border-radius:12px;padding:14px;margin-bottom:12px}
.sl{font-weight:800;color:var(--blue);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;margin:4px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--ice)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:.8rem;font-weight:700;color:var(--slate)}
.f input,.f select,.f textarea{padding:10px 11px;border:1.5px solid var(--fog);border-radius:var(--r);font-family:var(--sans);font-size:1rem;outline:none;background:#fff;width:100%;height:44px;-webkit-appearance:none;appearance:none}
.f textarea{height:auto;min-height:48px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue-mid)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue-mid)}
.f textarea{resize:vertical;min-height:44px}
.chk-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:.82rem;cursor:pointer}
.chk input{width:16px;height:16px}
.btn{padding:9px 14px;border-radius:var(--r);border:1.5px solid var(--fog);background:#fff;font-family:var(--sans);font-weight:700;font-size:.8rem;cursor:pointer;color:var(--navy)}
.btn:active{background:var(--frost)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:active{background:var(--blue-mid)}
.btn.warn{color:var(--err);border-color:#f3c9c3}
.btn.sm{padding:6px 10px;font-size:.72rem}
.pills{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--fog);position:sticky;top:58px;z-index:40;justify-content:center}
.pill{flex-shrink:0;padding:9px 15px;border-radius:999px;border:1.5px solid var(--fog);background:#fff;font-size:.82rem;font-weight:700;color:var(--slate);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.step{display:none}
.step.on{display:block}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--fog)}
.list-item:last-child{border-bottom:none}
.list-item .meta{font-size:.72rem;color:var(--mist);margin-top:2px}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:1.6rem;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:45}
.sig-box{border:1.5px dashed var(--fog);border-radius:var(--r);background:#fff;position:relative}
.sig-box canvas{width:100%;height:160px;touch-action:none;display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;border:1px solid var(--fog)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:.7rem;cursor:pointer}
.anexo-item{display:flex;gap:10px;align-items:center;border:1px solid var(--fog);border-radius:8px;padding:8px;margin-top:8px}
.anexo-item img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0}
.anexo-item .info{flex:1;min-width:0}
.anexo-item input{font-size:.78rem;padding:6px 8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:#fff;border-radius:12px;padding:14px;max-width:640px;width:100%;max-height:92vh;overflow:auto}
.crop-wrap{position:relative;touch-action:none;max-width:100%;background:#000;border-radius:8px;overflow:hidden}
.crop-wrap canvas{display:block;max-width:100%;height:auto}
.handle{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--blue);border:3px solid #fff;transform:translate(-50%,-50%);touch-action:none}
.pdf-overlay{position:fixed;inset:0;background:#fff;z-index:200;overflow:auto;padding:16px}
.pdf-bar{display:flex;gap:10px;margin-bottom:14px;position:sticky;top:0;background:#fff;padding-bottom:10px;border-bottom:2px solid var(--fog)}
@media print{.pdf-bar{display:none}}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:.82rem;font-weight:600;z-index:300;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.badge{display:inline-block;background:var(--ice);color:var(--blue);font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px}
hr.sep{border:none;border-top:1px solid var(--fog);margin:12px 0}
.hint{font-size:.7rem;color:var(--mist)}
@media(prefers-color-scheme:dark){
  body{background:#0e1621;color:#e7edf3}
  .card,.pills,.modal .box{background:#16212f;border-color:#233042}
  .topbar{background:#081527}
  .f input,.f select,.f textarea{background:#0e1621;color:#e7edf3;border-color:#233042}
  .pill{background:#16212f;border-color:#233042;color:#c3ccd6}
  .btn{background:#16212f;border-color:#233042;color:#e7edf3}
  .list-item{border-color:#233042}
}
</style>
</head>
<body>

<div class="topbar">
  <button id="btnBack" style="display:none" onclick="goHome()">‹ Volver</button>
  <h1 id="topTitle">Ficha de Terreno</h1>
</div>

<div id="home" class="wrap">
  <div class="card">
    <div class="sl">Fichas guardadas</div>
    <div id="listaFichas"></div>
    <div id="emptyMsg" class="hint" style="display:none;padding:8px 0">Sin fichas aún. Toca + para crear la primera.</div>
  </div>
</div>

<div id="editor" style="display:none">
  <div class="pills" id="pillNav"></div>
  <div class="wrap" id="stepsWrap"></div>
</div>

<button class="fab" id="fabNew" onclick="nuevaFicha()">+</button>
<div class="toast" id="toast"></div>

<!-- Modal recorte/enderezado -->
<div class="modal" id="cropModal" style="display:none">
  <div class="box">
    <div class="sl">Ajusta las esquinas del documento</div>
    <div class="crop-wrap" id="cropWrap">
      <canvas id="cropCanvas"></canvas>
    </div>
    <p class="hint">Arrastra los 4 puntos para que coincidan con los bordes de la hoja. Se enderezará automáticamente.</p>
    <div class="navbtns">
      <button class="btn" onclick="cancelCrop()">Cancelar</button>
      <button class="btn pri" onclick="applyCrop()">Recortar y enderezar</button>
    </div>
  </div>
</div>

<!-- área imprimible (oculta) -->
<div id="printArea" style="display:none"></div>

<script src="app.js"></script>
</body>
</html>
